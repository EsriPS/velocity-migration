title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out. Answering the prompts below helps the community give you a useful answer faster.

        Before posting, please search [existing discussions](../discussions) — your question may already be answered.

        > **Important:** This is a public space — do not paste GeoEvent Server configuration exports (XML), credentials, tokens, or other sensitive data. If answering your question requires your configuration, please [start a discussion](https://github.com/EsriPS/velocity-migration-feedback/discussions) and the maintainers will follow up privately to arrange a secure transfer.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the migration task or outcome you're working toward.
      placeholder: I'm migrating a GeoEvent Server input to Velocity and want to confirm the equivalent feed type.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: Steps you've already taken, and what happened. Include any error messages.
    validations:
      required: true
  - type: dropdown
    id: arcgis-environment
    attributes:
      label: ArcGIS environment
      description: Which ArcGIS environment are you working in?
      options:
        - ArcGIS Online
        - ArcGIS Enterprise
        - Not signed in
        - Other / not sure
    validations:
      required: true
  - type: input
    id: tool-release
    attributes:
      label: Tool release
      description: The release shown in the tool header (e.g. "Beta | 2026R1.0").
      placeholder: Beta | 2026R1.0
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that would help, such as screenshots or the component types involved. Redact first — do not paste full configuration (XML) exports, credentials, or hostnames.
    validations:
      required: false
