name: Bug report
description: Report something in the ArcGIS Velocity Migration Tool that is broken or not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix the issue quickly.

        Before submitting, please search [existing issues](../issues?q=is%3Aissue) to avoid duplicates.

        > **Important:** Do not attach or paste GeoEvent Server configuration exports (XML), credentials, tokens, or other sensitive data. This is a public repository. If reproducing the issue requires your configuration, please [start a discussion](https://github.com/EsriPS/velocity-migration-feedback/discussions) and the maintainers will follow up privately to arrange a secure transfer.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what the bug is.
      placeholder: When I migrate a GeoEvent output to Velocity, the mapped parameters are missing.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Select '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages you saw.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How did you run the tool?
      options:
        - Hosted application
        - Offline on GeoEvent Server
        - Offline on another web server
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: arcgis-environment
    attributes:
      label: ArcGIS environment
      description: Which ArcGIS environment were you signed in to?
      options:
        - ArcGIS Online
        - ArcGIS Enterprise
        - Not signed in
        - Other / not sure
    validations:
      required: true
  - type: input
    id: arcgis-version
    attributes:
      label: ArcGIS Enterprise version (if applicable)
      description: If you were using ArcGIS Enterprise, which version?
      placeholder: e.g. 11.3
    validations:
      required: false
  - type: input
    id: tool-release
    attributes:
      label: Tool release
      description: The release shown in the tool header (e.g. "Beta | 2026R1.0").
      placeholder: Beta | 2026R1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Which browser and version were you using?
      placeholder: e.g. Chrome 126, Safari 17, Edge 126
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots, logs, or additional context
      description: Add screenshots or console logs that might help. Redact first — do not paste full configuration (XML) exports, credentials, hostnames, or tokens.
    validations:
      required: false
  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data acknowledgement
      options:
        - label: I have not attached or pasted configuration exports (XML), credentials, tokens, or other sensitive data. I understand this is a public repository, and that full configurations should be shared privately by [starting a discussion](https://github.com/EsriPS/velocity-migration-feedback/discussions) so the maintainers can arrange a secure transfer.
          required: true
